<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <style>
    .bounce { animation: bounce 1.6s ease-in-out infinite; transform-origin: 120px 190px; }
    .wing-l { animation: flapL 1.6s ease-in-out infinite; transform-origin: 78px 128px; }
    .wing-r { animation: flapR 1.6s ease-in-out infinite; transform-origin: 162px 128px; }
    .eye { animation: blink 3.4s infinite; transform-origin: center; }
    .heart1 { animation: floatUp 3s ease-in infinite; }
    .heart2 { animation: floatUp 3s ease-in 1.5s infinite; }
    .shadow { animation: squish 1.6s ease-in-out infinite; transform-origin: 120px 205px; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scaleY(1); }
      35% { transform: translateY(-16px) scaleY(1.04); }
      55% { transform: translateY(0) scaleY(0.96); }
      70% { transform: translateY(-5px) scaleY(1.01); }
    }
    @keyframes flapL {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-28deg); }
      55% { transform: rotate(6deg); }
    }
    @keyframes flapR {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(28deg); }
      55% { transform: rotate(-6deg); }
    }
    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(1); }
      93%, 96% { transform: scaleY(0.08); }
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-56px) scale(1.15); }
    }
    @keyframes squish {
      0%, 100% { transform: scaleX(1); opacity: 0.35; }
      35% { transform: scaleX(0.72); opacity: 0.2; }
      55% { transform: scaleX(1.08); opacity: 0.4; }
    }
  </style>

  <ellipse class="shadow" cx="120" cy="205" rx="52" ry="9" fill="#E0218A"/>

  <g class="heart1">
    <path d="M40 96 c-5 -7 -16 -4 -16 4 c0 7 9 12 16 17 c7 -5 16 -10 16 -17 c0 -8 -11 -11 -16 -4 z" fill="#FF69B4"/>
  </g>
  <g class="heart2">
    <path d="M200 90 c-4 -6 -13 -3 -13 3 c0 6 7 10 13 14 c6 -4 13 -8 13 -14 c0 -6 -9 -9 -13 -3 z" fill="#E0218A"/>
  </g>

  <g class="bounce">
    <ellipse class="wing-l" cx="74" cy="132" rx="18" ry="26" fill="#FFC93C"/>
    <ellipse class="wing-r" cx="166" cy="132" rx="18" ry="26" fill="#FFC93C"/>

    <ellipse cx="120" cy="132" rx="58" ry="60" fill="#FFD966"/>
    <circle cx="120" cy="86" r="44" fill="#FFD966"/>

    <path d="M96 48 q6 -14 14 -2 q6 -14 12 -1 q7 -12 12 0" fill="none" stroke="#FFC93C" stroke-width="6" stroke-linecap="round"/>

    <path d="M84 44 c-8 -12 -26 -10 -26 2 c0 9 8 13 13 15 c-2 -6 0 -11 13 -17 z" fill="#FF69B4"/>
    <path d="M96 40 c8 -12 26 -10 26 2 c0 9 -8 13 -13 15 c2 -6 0 -11 -13 -17 z" fill="#FF69B4"/>
    <circle cx="90" cy="46" r="7" fill="#E0218A"/>

    <g class="eye"><circle cx="103" cy="88" r="6.5" fill="#1D334A"/><circle cx="105.5" cy="85.5" r="2.2" fill="#FFFFFF"/></g>
    <g class="eye"><circle cx="137" cy="88" r="6.5" fill="#1D334A"/><circle cx="139.5" cy="85.5" r="2.2" fill="#FFFFFF"/></g>

    <ellipse cx="94" cy="102" rx="8" ry="5" fill="#FF9EC9" opacity="0.85"/>
    <ellipse cx="146" cy="102" rx="8" ry="5" fill="#FF9EC9" opacity="0.85"/>

    <path d="M112 97 l16 0 l-8 11 z" fill="#FF8A3D"/>

    <ellipse cx="104" cy="196" rx="10" ry="5" fill="#FF8A3D"/>
    <ellipse cx="136" cy="196" rx="10" ry="5" fill="#FF8A3D"/>
  </g>
</svg>
