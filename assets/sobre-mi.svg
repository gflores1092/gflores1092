<text x="450" y="118" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="38" font-style="italic" font-weight="bold" fill="#E0218A">Hola, soy Yera</text>
<text x="450" y="150" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="19" fill="#FF69B4">Ingeniera industrial con MBA, trece años convirtiendo datos en resultados</text>
<text x="100" y="176" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="21" fill="#1D334A">💗  Enseño IA, ciencia de datos y análisis con humor y sin jerga</text><text x="100" y="214" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="21" fill="#1D334A">🐥  Más de 200 mil pollitos y pollitas ya aprendieron conmigo</text><text x="100" y="252" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="21" fill="#1D334A">🤖  Implemento IA, automatizaciones y dashboards con resultados medibles</text><text x="100" y="290" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="21" fill="#1D334A">🎤  Speaker en conferencias de tecnología, datos y mujeres en STEM</text><text x="100" y="328" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="21" fill="#1D334A">📷  Modelo y anfitriona, con mi signature look pelirroja</text><text x="100" y="366" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="21" fill="#1D334A">🌸  Lima, Perú, con el corazón en toda LATAM</text>
<text x="450" y="358" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif" font-size="24" font-style="italic" fill="#E0218A">"No necesitas saber programar, solo necesitas decidirte"</text>
